name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx prettier --check src
      - if: runner.os == 'Linux'
        run: npm run lint
      - if: runner.os == 'Linux'
        run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: dist
          path: dist
          retention-days: 7

  types:
    name: API types in sync with core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nosy-web
      - uses: actions/checkout@v7
        with:
          repository: nosyproxy/nosy
          path: nosy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nosy
      - name: Regenerate
        run: |
          rm -rf nosy-web/src/api/generated
          cargo test --manifest-path nosy/Cargo.toml -p nosy-model --locked --quiet
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/nosy-web/src/api/generated
      - name: Check for drift
        working-directory: nosy-web
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --short -- src/api/generated
            git --no-pager diff -- src/api/generated
            echo "::error::src/api/generated is out of date with nosyproxy/nosy — run 'make types' and commit."
            exit 1
          fi
